<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Name - Album Title</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="album-cover.jpg" alt="Album Cover" class="album-art">
            <h1>곡 제목 (Song Title)</h1>
            <p>아티스트명 (Artist Name)</p>
        </header>

        <main class="links">
            <a href="멜론링크" target="_blank" class="link-card">
                <img src="melon-icon.png" alt="Melon">
                <span>Melon</span>
                <div class="btn">Play</div>
            </a>
            <a href="스포티파이링크" target="_blank" class="link-card">
                <img src="spotify-icon.png" alt="Spotify">
                <span>Spotify</span>
                <div class="btn">Play</div>
            </a>
            <a href="유튜브뮤직링크" target="_blank" class="link-card">
                <img src="ytmusic-icon.png" alt="YouTube Music">
                <span>YouTube Music</span>
                <div class="btn">Play</div>
            </a>
        </main>

        <footer>
            <p>© 2026 Artist Name. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
