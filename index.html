<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김찬호 - 우리의 마지막 오늘이라면 </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="album-cover.jpg" alt="Album Cover" class="album-art">

            <p>김찬호 (Artist Name)</p>

        <main class="links">

                <span>Melon</span>
                <div class="btn">Play</div>

            <a href="https://open.spotify.com/track/7lzb1Z4EfgKLNtfRmoOH1n?si=263e006a2ec64e4d" target="_blank" class="link-card">

                <div class="btn">Play</div>
            </a>
            <a href="https://www.youtube.com/watch?v=F3Ol70wm4oM" target="_blank" class="link-card">
                <img src="ytmusic-icon.png" alt="YouTube Music">
                <span>YouTube Music</span>
                <div class="btn">Play</div>
            </a>
        </main>

        <footer>
            <p>© 2026 Kakao Entertainment. All rights reserved.</p>
        </footer>
    </div>

</html>
